<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentdash</title>
<style>
  :root {
    --bg: #edf0f2;
    --panel: #ffffff;
    --ink: #1b2430;
    --muted: #5b6673;
    --line: #d6dce2;
    --accent: #2457c5;
    --accent-ink: #ffffff;
    --tool: #0f766e;
    --err: #b42318;
    --user-bg: #e3eaf7;
    --code-bg: #f4f6f8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a21;
      --panel: #1c232c;
      --ink: #e6eaef;
      --muted: #93a0ae;
      --line: #2c3540;
      --accent: #7aa2f7;
      --accent-ink: #0f1520;
      --tool: #5ec4b6;
      --err: #f07167;
      --user-bg: #243049;
      --code-bg: #161c24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 var(--sans);
    display: grid; grid-template-columns: 220px 1fr;
  }
  button, textarea { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible, .agent:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* lista de agenti */
  aside { border-right: 1px solid var(--line); padding: 20px 12px; overflow-y: auto; }
  .brand { font-weight: 650; font-size: 17px; padding: 0 8px 16px; }
  .agent {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px; border: 0; border-radius: 6px; background: none;
    text-align: left; cursor: pointer;
  }
  .agent:hover { background: var(--panel); }
  .agent[aria-current="true"] { background: var(--panel); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .agent.running .dot { background: var(--tool); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .agent.running .dot { animation: none; } }
  .aside-empty { color: var(--muted); font-size: 13px; padding: 8px; }

  /* zona principala */
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; height: 100vh; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 28px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .meta { color: var(--muted); font-size: 13px; }
  .ghost {
    border: 1px solid var(--line); background: var(--panel);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .ghost:disabled { opacity: .5; cursor: default; }

  #scroll { overflow-y: auto; padding: 24px 28px; }
  .transcript { max-width: 780px; margin: 0 auto; }
  .empty { color: var(--muted); max-width: 780px; margin: 40px auto; }
  .empty code { font-family: var(--mono); font-size: 13px; }

  .msg { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user {
    background: var(--user-bg); padding: 10px 14px; border-radius: 10px;
    margin-left: 15%;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .note.err { color: var(--err); }

  /* apelurile de tool: sina verticala, ca un jurnal de actiuni */
  details.tool {
    border-left: 2px solid var(--tool); padding: 2px 0 2px 12px; margin: 0 0 12px;
  }
  details.tool.failed { border-left-color: var(--err); }
  details.tool summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary b { color: var(--tool); font-weight: 600; }
  details.tool.failed summary b { color: var(--err); }
  details.tool.pending summary b::after { content: " ..."; }
  pre {
    font: 12.5px/1.5 var(--mono); background: var(--code-bg);
    padding: 10px 12px; border-radius: 6px; margin: 8px 0;
    overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 320px; overflow-y: auto;
  }

  /* composer */
  form {
    border-top: 1px solid var(--line); padding: 14px 28px 18px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  form > div { flex: 1; max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 200px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel);
  }
  .primary {
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .primary.stop { background: var(--err); color: #fff; }
  .primary:disabled { opacity: .5; cursor: default; }

  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 8px; }
    .brand { display: none; }
    .agent { width: auto; white-space: nowrap; }
    main { height: auto; min-height: 0; }
    header, #scroll, form { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">agentdash</div>
  <nav id="agents"></nav>
</aside>

<main>
  <header>
    <div>
      <h1 id="title">Alege un agent</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="ghost" id="reset" disabled>Sesiune noua</button>
  </header>

  <div id="scroll">
    <div class="empty" id="empty">Alege un agent din stanga.</div>
  </div>

  <form id="composer">
    <div>
      <textarea id="prompt" rows="1" placeholder="Scrie un prompt. Enter trimite, Shift+Enter linie noua." disabled></textarea>
      <button class="primary" id="send" disabled>Trimite</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = {
  agents: [],
  current: null,              // numele agentului selectat
  views: new Map(),           // agent -> { el, stream, runId, tools: Map }
};

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 204 || res.status === 202) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function loadAgents() {
  state.agents = await api("/api/agents");
  renderAgents();
  renderHeader();
}

// ---------- lista agenti ----------
function renderAgents() {
  const nav = $("agents");
  nav.replaceChildren();
  if (!state.agents.length) {
    const p = document.createElement("div");
    p.className = "aside-empty";
    p.textContent = "Niciun agent. Adauga un folder in ~/.agentdash/agents.";
    nav.append(p);
    return;
  }
  for (const a of state.agents) {
    const b = document.createElement("button");
    b.className = "agent" + (a.activeRunId ? " running" : "");
    b.setAttribute("aria-current", a.name === state.current ? "true" : "false");
    const dot = document.createElement("span");
    dot.className = "dot";
    const name = document.createElement("span");
    name.textContent = a.name;
    b.append(dot, name);
    b.onclick = () => selectAgent(a.name);
    nav.append(b);
  }
}

function currentAgent() {
  return state.agents.find((a) => a.name === state.current);
}

function renderHeader() {
  const a = currentAgent();
  if (!a) return;
  $("title").textContent = a.name;
  const running = !!a.activeRunId;
  $("meta").textContent = running
    ? "Ruleaza acum"
    : a.sessionId
      ? "Continua sesiunea " + a.sessionId.slice(0, 8)
      : "Sesiune noua" + (a.hasClaudeMd ? "" : ". Folderul nu are CLAUDE.md");
  $("reset").disabled = running || !a.sessionId;
  $("prompt").disabled = false;
  const send = $("send");
  send.disabled = false;
  send.textContent = running ? "Opreste" : "Trimite";
  send.classList.toggle("stop", running);
}

// ---------- transcript per agent ----------
function viewFor(name) {
  if (!state.views.has(name)) {
    const el = document.createElement("div");
    el.className = "transcript";
    state.views.set(name, { el, stream: null, runId: null, tools: new Map() });
  }
  return state.views.get(name);
}

function selectAgent(name) {
  state.current = name;
  const v = viewFor(name);
  const scroll = $("scroll");
  scroll.replaceChildren(v.el);
  if (!v.el.childElementCount) {
    const e = document.createElement("div");
    e.className = "empty";
    e.id = "empty";
    e.innerHTML = "Scrie un prompt ca sa pornesti agentul. Ruleaza in folderul <code></code>.";
    e.querySelector("code").textContent = "~/.agentdash/agents/" + name;
    v.el.append(e);
  }
  const a = currentAgent();
  // daca agentul ruleaza deja (ex. dupa refresh), ne reatasam la stream
  if (a && a.activeRunId && v.runId !== a.activeRunId) attach(name, a.activeRunId);
  renderAgents();
  renderHeader();
  $("prompt").focus();
  scroll.scrollTop = scroll.scrollHeight;
}

function append(v, node) {
  v.el.querySelector(".empty")?.remove();
  const scroll = $("scroll");
  const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80;
  v.el.append(node);
  if (nearBottom && state.views.get(state.current) === v) scroll.scrollTop = scroll.scrollHeight;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

// ---------- stream SSE ----------
function attach(name, runId) {
  const v = viewFor(name);
  if (v.stream) v.stream.close();
  v.runId = runId;
  v.tools.clear();
  const es = new EventSource(`/api/runs/${runId}/events`);
  v.stream = es;
  es.onmessage = (msg) => {
    let ev;
    try { ev = JSON.parse(msg.data); } catch { append(v, el("p", "note", msg.data)); return; }
    render(v, ev);
    if (ev.type === "agentdash_done") {
      es.close();
      v.stream = null;
      loadAgents();
    }
  };
  es.onerror = () => {
    // la refresh sau oprirea serverului; dupa agentdash_done e deja inchis
    if (es.readyState === EventSource.CLOSED) v.stream = null;
  };
}

// Transforma un eveniment stream-json in elemente de UI.
function render(v, ev) {
  switch (ev.type) {
    case "agentdash_start":
      append(v, el("div", "msg user", ev.prompt));
      break;

    case "system":
      if (ev.subtype === "init" && ev.model) {
        append(v, el("p", "note", "Model " + ev.model));
      }
      break;

    case "assistant":
      for (const block of ev.message?.content || []) {
        if (block.type === "text" && block.text.trim()) {
          append(v, el("div", "msg", block.text));
        } else if (block.type === "tool_use") {
          const d = el("details", "tool pending");
          const s = el("summary");
          s.append(el("b", null, block.name), " " + toolHint(block.input));
          d.append(s, el("pre", null, JSON.stringify(block.input, null, 2)));
          v.tools.set(block.id, d);
          append(v, d);
        }
      }
      break;

    case "user":
      for (const block of ev.message?.content || []) {
        if (block.type !== "tool_result") continue;
        const d = v.tools.get(block.tool_use_id);
        if (!d) continue;
        d.classList.remove("pending");
        if (block.is_error) d.classList.add("failed");
        d.append(el("pre", null, truncate(resultText(block.content), 4000)));
      }
      break;

    case "result": {
      const parts = [];
      if (ev.duration_ms != null) parts.push("Terminat in " + (ev.duration_ms / 1000).toFixed(1) + "s");
      if (ev.num_turns != null) parts.push(ev.num_turns + " ture");
      if (ev.total_cost_usd != null) parts.push("$" + ev.total_cost_usd.toFixed(4));
      const isErr = ev.is_error || (ev.subtype && ev.subtype !== "success");
      append(v, el("p", "note" + (isErr ? " err" : ""), isErr ? "Eroare: " + (ev.subtype || "") : parts.join(", ")));
      break;
    }

    case "agentdash_stderr":
      append(v, el("p", "note err", ev.text));
      break;

    case "agentdash_done":
      if (ev.status === "stopped") append(v, el("p", "note", "Oprit manual."));
      if (ev.status === "error") append(v, el("p", "note err", "Procesul claude a iesit cu eroare. " + (ev.error || "")));
      break;
  }
}

// un indiciu scurt langa numele tool-ului: fisierul, comanda sau patternul
function toolHint(input = {}) {
  const h = input.file_path || input.command || input.pattern || input.path || input.url || input.description || "";
  return truncate(String(h).split("\n")[0], 90);
}

function resultText(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) return content.map((c) => c.text ?? JSON.stringify(c)).join("\n");
  return JSON.stringify(content, null, 2);
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + "\n[... trunchiat]" : s;
}

// ---------- actiuni ----------
$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const a = currentAgent();
  if (!a) return;
  const v = viewFor(a.name);

  if (a.activeRunId) {
    await api(`/api/runs/${a.activeRunId}/stop`, { method: "POST" }).catch(showError);
    return;
  }

  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  $("send").disabled = true;
  try {
    const { runId } = await api(`/api/agents/${encodeURIComponent(a.name)}/runs`, {
      method: "POST",
      body: JSON.stringify({ prompt }),
    });
    $("prompt").value = "";
    autosize();
    attach(a.name, runId);
    await loadAgents();
  } catch (err) {
    showError(err);
    $("send").disabled = false;
  }
};

$("reset").onclick = async () => {
  const a = currentAgent();
  if (!a) return;
  await api(`/api/agents/${encodeURIComponent(a.name)}/reset`, { method: "POST" }).catch(showError);
  append(viewFor(a.name), el("p", "note", "Sesiune noua. Urmatorul prompt nu mai continua conversatia de mai sus."));
  await loadAgents();
};

$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

function autosize() {
  const t = $("prompt");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
$("prompt").addEventListener("input", autosize);

function showError(err) {
  const a = currentAgent();
  if (a) append(viewFor(a.name), el("p", "note err", err.message));
}

loadAgents().then(() => {
  if (state.agents.length) selectAgent(state.agents[0].name);
}).catch(showError);
</script>
</body>
</html>
