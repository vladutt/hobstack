# La push-ul unui tag v* (de ex. v1.0.0): teste, arhivele pentru macOS / Linux / Windows si release-ul pe GitHub.
# Notele release-ului: mesajul tag-ului adnotat (git tag -a v1.1.0 -m "..."), altfel commit-urile de la tag-ul precedent.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: NSIS (Windows installer)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
        env:
          REQUIRE_INSTALLER: "1"
      - name: Release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          fi
          if [ ! -s notes.md ]; then
            prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "${prev}..${tag}" > notes.md
            else
              echo "First release of HobStack." > notes.md
            fi
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/HobStack-Setup-*.exe dist/checksums.txt --title "HobStack ${GITHUB_REF_NAME}" --notes-file notes.md
