# La push-ul unui tag v* (de ex. v1.0.0): teste, apoi release-ul pe GitHub cu:
#   - macOS (runner macOS, cu cgo pentru bara de meniu): tar.gz arm64 / amd64 si HobStack-<v>.dmg (app universal)
#   - Linux si Windows (runner Linux): tar.gz, zip si installerul HobStack-Setup-<v>.exe (NSIS)
#   - checksums.txt pentru tot (update-ul din aplicatie il verifica)
# Notele release-ului: mesajul tag-ului adnotat (git tag -a v1.1.0 -m "..."), altfel commit-urile de la tag-ul precedent.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Semnarea Developer ID + notarizarea (docs/macos-signing.md): doar cand exista secretul MACOS_CERT_P12. Fara el
  # (fork-uri, inainte de configurare) build-ul merge mai departe cu semnatura ad-hoc.
  mac:
    runs-on: macos-latest
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/... ./internal/selfupdate/...
      - name: Import signing certificate
        if: env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          [ -n "$MACOS_SIGN_IDENTITY" ] || { echo "MACOS_CERT_P12 is set but MACOS_SIGN_IDENTITY is missing" >&2; exit 1; }
          # keychain temporar cu parola aleatoare, sters la final de pasul "Delete signing keychain"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/hobstack-signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          echo "::add-mask::$kc_pass"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$kc_pass" "$SIGNING_KEYCHAIN"
          security import "$p12" -k "$SIGNING_KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          # codesign foloseste cheia fara dialog de confirmare
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$SIGNING_KEYCHAIN" > /dev/null
          # keychain-ul nou intra in lista de cautare, langa cele existente
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" $existing
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep -F "$MACOS_SIGN_IDENTITY" \
            || { echo "identity from MACOS_SIGN_IDENTITY not found in the imported certificate" >&2; exit 1; }
      - name: Build (signed and notarized when the secrets exist)
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_MACOS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-mac.sh "${GITHUB_REF_NAME}"
      - name: Delete signing keychain
        if: always()
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/hobstack-signing.keychain-db"
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.tar.gz
            dist/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: mac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: NSIS (Windows installer)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
        env:
          REQUIRE_INSTALLER: "1"
          SKIP_CHECKSUMS: "1"
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - run: scripts/checksums.sh
      - name: Release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          fi
          if [ ! -s notes.md ]; then
            prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "${prev}..${tag}" > notes.md
            else
              echo "First release of HobStack." > notes.md
            fi
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/*.dmg dist/HobStack-Setup-*.exe dist/checksums.txt --title "HobStack ${GITHUB_REF_NAME}" --notes-file notes.md
